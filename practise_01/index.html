<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пиксельный маскот Claude</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="title">CLAUDE&nbsp;CODE&nbsp;•&nbsp;подсказки</span>
    <span id="counter" class="counter">Подсказки: 0</span>
  </header>

  <div id="mascot">
    <div id="mascot-inner">
      <canvas id="sprite" width="16" height="16"></canvas>
    </div>
  </div>

  <p class="hint">кликните в любом месте — маскот поделится подсказкой</p>

  <script src="script.js"></script>
</body>
</html>
