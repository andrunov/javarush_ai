<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CLAWD RUN — пиксельный раннер</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <span class="logo">CLAWD&nbsp;<b>RUN</b></span>
    <span class="tagline">беги • прыгай • собирай подсказки</span>
  </header>

  <div id="stage">
    <div class="wrap">
      <canvas id="game" width="960" height="540" aria-label="CLAWD RUN — игра"></canvas>

      <div id="start" class="overlay">
        <h1 class="game-title">CLAWD&nbsp;RUN</h1>
        <p class="game-sub">маскот бежит от багов и собирает подсказки-звёзды</p>
        <p class="controls">пробел / клик — прыжок · дважды — двойной прыжок</p>
        <button id="startBtn" class="btn">▶ Старт</button>
        <p class="best" id="startBest"></p>
      </div>

      <div id="gameover" class="overlay hide">
        <h2 class="game-title over">☠ баги догнали</h2>
        <p class="result">очки: <b id="finalScore">0</b></p>
        <p class="result">подсказки: <b id="finalTips">0</b></p>
        <p class="best" id="overBest"></p>
        <button id="againBtn" class="btn">↻ Ещё раз</button>
        <p class="controls">пробел / клик — снова</p>
      </div>

      <button id="soundBtn" class="sound" title="звук вкл/выкл">🔊</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
